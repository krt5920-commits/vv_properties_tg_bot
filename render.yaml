services:
  - type: worker
    name: telegram-bot-uae
    env: python
    region: oregon # You can change this to a region closer to you, e.g., frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3.11 main.py"
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: "https://api.openai.com/v1"
      - key: OWNER_CHAT_ID
        sync: false
